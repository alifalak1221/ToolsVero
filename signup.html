<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | ToolsVero</title><link rel="icon" type="image/png" href="favicon.png"><style>:root{--bg:#080808;--surface:#121212;--text:#f8f3e6;--muted:#aaa396;--gold:#d4af37;--gold2:#f1d36a;--border:#302d26}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,rgba(212,175,55,.18),transparent 45%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}.box{width:min(700px,100%);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px;box-shadow:0 20px 60px #0008}.logo{font-size:26px;font-weight:900;text-align:center;margin-bottom:24px}.logo span{color:var(--gold2)}.eyebrow{display:inline-block;border:1px solid var(--border);color:var(--gold2);padding:6px 12px;border-radius:999px;font-size:11px;font-weight:900}.center{text-align:center}h1{font-size:42px;line-height:1.05;margin:16px 0 8px}h1 span{color:var(--gold2)}p{color:var(--muted)}form{display:grid;gap:10px;margin-top:22px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:13px;font-weight:800}.field{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:#191919;color:var(--text);outline:0}.field:focus{border-color:var(--gold)}.check{display:flex;gap:9px;align-items:flex-start;color:var(--muted);font-size:13px;margin-top:5px}.check input{margin-top:3px;accent-color:var(--gold)}.btn{border:1px solid var(--gold);background:var(--gold);color:#080808;padding:12px 16px;border-radius:10px;font-weight:900;cursor:pointer;margin-top:7px}.msg{display:none;padding:10px;border-radius:9px;font-size:13px;border:1px solid #a55;background:#301416;color:#ffb7b7}.links{margin-top:18px;text-align:center;color:var(--muted);font-size:13px}.links a{color:var(--gold2);text-decoration:none}.back{display:block;text-align:center;margin-top:20px;color:var(--muted);text-decoration:none;font-size:13px}.back:hover,.links a:hover{color:var(--gold2)}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><main class="box"><div class="logo">Tools<span>Vero</span></div><div class="center"><div class="eyebrow">TOOLSVERO ACCOUNT</div><h1>Create an <span>account</span></h1><p>Tell us a few basic details so your ToolsVero account can be personalized.</p></div><form id="signupForm"><div class="row"><div><label>Full name</label><input class="field" id="name" required autocomplete="name"></div><div><label>Phone number</label><input class="field" id="phone" type="tel" required autocomplete="tel" placeholder="+92..."></div></div><label>Email address</label><input class="field" id="email" type="email" required autocomplete="email"><div class="row"><div><label>Country</label><input class="field" id="country" required autocomplete="country-name"></div><div><label>Account type</label><select class="field" id="accountType" required><option value="">Select one</option><option>Personal</option><option>Business</option><option>Creator</option><option>Student</option></select></div></div><label>What will you mainly use ToolsVero for?</label><select class="field" id="useCase" required><option value="">Select one</option><option>Images & design</option><option>PDF & documents</option><option>Business & work</option><option>Study & learning</option><option>Personal tasks</option><option>Other</option></select><div class="row"><div><label>Password</label><input class="field" id="password" type="password" minlength="6" required autocomplete="new-password"></div><div><label>Confirm password</label><input class="field" id="confirm" type="password" minlength="6" required autocomplete="new-password"></div></div><label class="check"><input type="checkbox" id="terms" required><span>I agree to the ToolsVero Terms & Conditions and Privacy Policy.</span></label><label class="check"><input type="checkbox" id="updates"><span>Send me occasional ToolsVero updates and useful digital tips. (Optional)</span></label><button class="btn">Create account</button><div class="msg" id="msg"></div></form><div class="links">Already have an account? <a href="login.html">Sign in</a></div><a class="back" href="index.html">← Back to ToolsVero</a></main><script>const key=e=>'toolsvero-user-'+e;function setUser(u){localStorage.setItem('toolsvero-user',JSON.stringify(u))}document.getElementById('signupForm').addEventListener('submit',e=>{e.preventDefault();const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),email=document.getElementById('email').value.trim().toLowerCase(),country=document.getElementById('country').value.trim(),accountType=document.getElementById('accountType').value,useCase=document.getElementById('useCase').value,password=document.getElementById('password').value,confirm=document.getElementById('confirm').value,updates=document.getElementById('updates').checked,msg=document.getElementById('msg');if(password!==confirm){msg.style.display='block';msg.textContent='Passwords do not match.';return}if(localStorage.getItem(key(email))){msg.style.display='block';msg.textContent='An account with this email already exists. Please sign in.';return}const u={name,phone,email,country,accountType,useCase,updates,password};localStorage.setItem(key(email),JSON.stringify(u));setUser(u);location.href='index.html#/dashboard'});</script></body></html>

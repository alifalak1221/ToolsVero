<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In | ToolsVero</title><link rel="icon" type="image/png" href="favicon.png"><style>:root{--bg:#080808;--surface:#121212;--text:#f8f3e6;--muted:#aaa396;--gold:#d4af37;--gold2:#f1d36a;--border:#302d26}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,rgba(212,175,55,.18),transparent 45%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}.box{width:min(520px,100%);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px;box-shadow:0 20px 60px #0008}.logo{font-size:26px;font-weight:900;text-align:center;margin-bottom:24px}.logo span{color:var(--gold2)}.eyebrow{display:inline-block;border:1px solid var(--border);color:var(--gold2);padding:6px 12px;border-radius:999px;font-size:11px;font-weight:900}.center{text-align:center}h1{font-size:42px;line-height:1.05;margin:16px 0 8px}h1 span{color:var(--gold2)}p{color:var(--muted)}form{display:grid;gap:10px;margin-top:22px}label{font-size:13px;font-weight:800}.field{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:#191919;color:var(--text);outline:0}.field:focus{border-color:var(--gold)}.btn{border:1px solid var(--gold);background:var(--gold);color:#080808;padding:12px 16px;border-radius:10px;font-weight:900;cursor:pointer;margin-top:7px}.msg{display:none;padding:10px;border-radius:9px;font-size:13px;border:1px solid #a55;background:#301416;color:#ffb7b7}.links{margin-top:18px;text-align:center;color:var(--muted);font-size:13px}.links a{color:var(--gold2);text-decoration:none}.back{display:block;text-align:center;margin-top:20px;color:var(--muted);text-decoration:none;font-size:13px}.back:hover,.links a:hover{color:var(--gold2)}</style></head><body><main class="box"><div class="logo">Tools<span>Vero</span></div><div class="center"><div class="eyebrow">TOOLSVERO ACCOUNT</div><h1>Sign <span>in</span></h1><p>Access your ToolsVero dashboard and account.</p></div><form id="loginForm"><label>Email address</label><input class="field" type="email" id="email" required autocomplete="email"><label>Password</label><input class="field" type="password" id="password" required autocomplete="current-password"><button class="btn">Sign in</button><div class="msg" id="msg"></div></form><div class="links">Don't have an account? <a href="signup.html">Create one</a></div><a class="back" href="index.html">← Back to ToolsVero</a></main><script>const key=e=>'toolsvero-user-'+e;function setUser(u){localStorage.setItem('toolsvero-user',JSON.stringify(u))}document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value,raw=localStorage.getItem(key(email)),msg=document.getElementById('msg');if(!raw){msg.style.display='block';msg.textContent='No account found. Please create an account first.';return}const u=JSON.parse(raw);if(u.password!==password){msg.style.display='block';msg.textContent='Incorrect password.';return}setUser(u);location.href='index.html#/dashboard'});</script></body></html>
